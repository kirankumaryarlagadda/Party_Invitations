<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Akhira RSVPs</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root { --ink: #4a2d6b; --soft: #7a5f99; --pink: #ff6fb5; --purple: #9b6bff; --line: rgba(155,107,255,.22); --bg: #f7f2ff; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Fredoka", system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  main { max-width: 900px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-family: "Pacifico", cursive; font-weight: 400; font-size: 34px; margin: 0 0 4px; color: var(--purple); }
  .sub { color: var(--soft); margin: 0 0 20px; }
  .panel { background: #fff; border: 2px solid var(--line); border-radius: 20px; padding: 18px; }
  form { display: grid; gap: 12px; max-width: 360px; }
  label { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
  input { font: inherit; font-size: 16px; padding: 11px 13px; border-radius: 12px; border: 2px solid var(--line); }
  .btn { font: inherit; font-weight: 600; cursor: pointer; padding: 10px 16px; border-radius: 999px; border: 2px solid var(--line); background: #fff; color: var(--ink); }
  .btn-primary { background: linear-gradient(90deg, var(--pink), var(--purple)); color: #fff; border-color: transparent; }
  .msg { color: #c0306f; min-height: 1.2em; margin: 0; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: #fff; border: 2px solid var(--line); border-radius: 18px; padding: 14px; }
  .stat .n { font-size: 30px; font-weight: 700; line-height: 1.1; }
  .stat .l { font-size: 13px; color: var(--soft); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--soft); }
  td.num { text-align: right; } th.num { text-align: right; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .yes { background: #dcfce7; color: #166534; } .maybe { background: #fef3c7; color: #92400e; } .no { background: #fee2e2; color: #991b1b; }
  tr.old td { opacity: .45; text-decoration: line-through; }
  .note { color: var(--soft); max-width: 260px; }
  .empty { text-align: center; color: var(--soft); padding: 24px; }
  .del { font: inherit; border: 0; background: none; color: var(--soft); cursor: pointer; padding: 2px 6px; border-radius: 8px; }
  .del:hover { background: #fee2e2; color: #991b1b; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Akhira's RSVPs 🦄</h1>
  <p class="sub">Sat, Dec 5, 2026 · 6–8 PM · Hooray! Kids Indoor Play Center</p>

  <section class="panel" id="login">
    <form id="login-form">
      <label>Email <input name="email" type="email" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-primary" type="submit">Sign in</button>
      <p class="msg" id="login-msg"></p>
    </form>
    <p class="sub" style="margin:10px 0 0">Host login (Supabase Auth user listed in party_admins).</p>
  </section>

  <section id="dash" hidden>
    <div class="stats" id="stats"></div>
    <div class="panel">
      <div class="bar">
        <strong id="count-line"></strong>
        <span>
          <button class="btn" id="refresh">↻ Refresh</button>
          <button class="btn" id="csv">⬇ CSV</button>
          <button class="btn" id="logout">Sign out</button>
        </span>
      </div>
      <div class="scroll">
        <table>
          <thead><tr><th>Name</th><th>Reply</th><th class="num">Kids</th><th class="num">Adults</th><th>Contact</th><th>Note</th><th>When</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="sub" style="margin:12px 0 0;font-size:14px">If someone RSVPs more than once (same name), only their latest answer counts toward totals; older ones are struck through.</p>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="/shared/supabase-config.js"></script>
<script>
  (function () {
    var PARTY_SLUG = 'akhira-5th-birthday';
    var cfg = window.PARTY_SUPABASE || {};
    var $ = function (id) { return document.getElementById(id); };
    if (!cfg.anonKey || /PASTE_/.test(cfg.anonKey + cfg.url)) {
      $('login-msg').textContent = 'Supabase URL / anon key not set in /shared/supabase-config.js';
      return;
    }
    var db = window.supabase.createClient(cfg.url, cfg.anonKey);
    var rows = [];

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function key(r) { return r.name.trim().toLowerCase(); }

    async function show() {
      var s = await db.auth.getSession();
      var signedIn = !!(s.data && s.data.session);
      $('login').hidden = signedIn; $('dash').hidden = !signedIn;
      if (signedIn) load();
    }

    async function load() {
      var res = await db.from('party_rsvps').select('*').eq('party_slug', PARTY_SLUG).order('created_at', { ascending: false });
      if (res.error) { $('count-line').textContent = 'Could not load: ' + res.error.message; return; }
      rows = res.data;
      var seen = {}, latest = [];
      rows.forEach(function (r) { r._old = !!seen[key(r)]; if (!r._old) { seen[key(r)] = 1; latest.push(r); } });

      var sum = function (st, f) { return latest.filter(function (r) { return r.attending === st; }).reduce(function (a, r) { return a + r[f]; }, 0); };
      var cnt = function (st) { return latest.filter(function (r) { return r.attending === st; }).length; };
      $('stats').innerHTML = [
        [sum('yes', 'kids'), 'Kids coming'],
        [sum('yes', 'adults'), 'Adults coming'],
        [cnt('yes'), 'Families yes'],
        [cnt('maybe'), 'Maybe (' + sum('maybe', 'kids') + ' kids)'],
        [cnt('no'), 'Can’t make it']
      ].map(function (s) { return '<div class="stat"><div class="n">' + s[0] + '</div><div class="l">' + s[1] + '</div></div>'; }).join('');

      $('count-line').textContent = latest.length + (latest.length === 1 ? ' reply' : ' replies') + (rows.length > latest.length ? ' (' + (rows.length - latest.length) + ' updated)' : '');
      $('rows').innerHTML = rows.length ? rows.map(function (r) {
        return '<tr class="' + (r._old ? 'old' : '') + '"><td><strong>' + esc(r.name) + '</strong></td>' +
          '<td><span class="pill ' + r.attending + '">' + r.attending + '</span></td>' +
          '<td class="num">' + r.kids + '</td><td class="num">' + r.adults + '</td>' +
          '<td>' + esc(r.contact) + '</td><td class="note">' + esc(r.note) + '</td>' +
          '<td>' + new Date(r.created_at).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + '</td>' +
          '<td><button class="del" data-id="' + r.id + '" title="Delete this reply">✕</button></td></tr>';
      }).join('') : '<tr><td colspan="8" class="empty">No RSVPs yet — share the invite! 🦄</td></tr>';
    }

    $('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      var f = new FormData(e.target);
      $('login-msg').textContent = 'Signing in…';
      var res = await db.auth.signInWithPassword({ email: f.get('email'), password: f.get('password') });
      $('login-msg').textContent = res.error ? res.error.message : '';
      if (!res.error) show();
    });
    $('logout').addEventListener('click', async function () { await db.auth.signOut(); show(); });
    $('refresh').addEventListener('click', load);
    $('rows').addEventListener('click', async function (e) {
      var b = e.target.closest('.del'); if (!b) return;
      var r = rows.find(function (x) { return x.id === b.dataset.id; });
      if (!confirm('Delete the reply from ' + r.name + '?')) return;
      var res = await db.from('party_rsvps').delete().eq('id', r.id);
      if (res.error) alert(res.error.message); else load();
    });
    $('csv').addEventListener('click', function () {
      var cols = ['name', 'attending', 'kids', 'adults', 'contact', 'note', 'created_at', 'superseded'];
      var q = function (v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
      var csv = [cols.join(',')].concat(rows.map(function (r) {
        return cols.map(function (c) { return q(c === 'superseded' ? (r._old ? 'yes' : '') : r[c]); }).join(',');
      })).join('\n');
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
      a.download = PARTY_SLUG + '-rsvps.csv'; a.click();
    });

    show();
  })();
</script>
</body>
</html>
